name: Windows Cloud RDP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user CynetAdmin Cynet@2026

      - name: 3. Install & Connect Tailscale VPN (As Exit Node)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Services\Tcpip\Parameters' -Name IPEnableRouter -Value 1
          
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --advertise-exit-node
          
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " >>> RDP & EXIT NODE IS READY! <<<" -ForegroundColor Cyan
          Write-Host " Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host " Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host " Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (350 Minutes)
        run: |
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/350] Server running..."
          }

      - name: 5. Compress and Transfer Files via Tailscale
        if: always()
        run: |
          Write-Host "Compressing downloaded files..." -ForegroundColor Cyan
          $sourcePath = "C:\Users\RunnerAdmin\Downloads"
          $zipPath = "C:\Users\RunnerAdmin\Desktop\Backup_Files.zip"
          
          if (Test-Path $sourcePath) {
              Compress-Archive -Path "$sourcePath\*" -DestinationPath $zipPath -Force
          }
          
          Write-Host "Sending backup zip file via Taildrop to redmi-13c..." -ForegroundColor Cyan
          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          
          if (Test-Path $tailscalePath -and Test-Path $zipPath) {
              & $tailscalePath file send "$zipPath" "redmi-13c:"
              
              # مکث ۳۰ ثانیه‌ای برای اینکه فایل کاملاً از طریق تیل‌اسکیل به گوشی منتقل شود
              Write-Host "Waiting for transfer to complete..." -ForegroundColor Yellow
              Start-Sleep -Seconds 30
              
              Write-Host "Backup file sent successfully!" -ForegroundColor Green
          }
